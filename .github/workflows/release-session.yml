# A `session-vX.Y.Z` tag builds tako-session for macOS arm64 and Linux x86_64
# and publishes both, with their SHA-256 sums, as that tag's release.
name: Release tako-session

on:
  push:
    tags: ["session-v*"]
  # A change to this workflow builds both binaries without publishing them.
  pull_request:
    paths: [".github/workflows/release-session.yml"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  MITTS_NO_SOURCE_FALLBACK: "1"
  # Raise together with the two mitts_sha256 digests below.
  MITTS_VERSION: "0.5.7"

jobs:
  build:
    name: build (${{ matrix.asset }})
    strategy:
      # Both platforms report, even when one fails; publish needs both.
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            asset: tako-session-macos-arm64
            mitts: aarch64-apple-darwin
            mitts_sha256: 848d4f63fa0239e27b5e18e8080fbd8ce50d0bfa7d6f5bc13094b629afa23600
          # The oldest supported runner: its glibc is the floor the binary needs.
          - os: ubuntu-22.04
            asset: tako-session-linux-x86_64
            mitts: x86_64-unknown-linux-gnu
            mitts_sha256: 30ac14a4c427c537bdb4a61b720ec68b2cd8131bc9fe3e7ee1a3523f92ad9e66
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      # The release archive itself, checked against a digest kept here: nothing
      # downloaded runs before it is verified.
      - name: Install Mitts
        run: |
          set -euo pipefail
          archive="mitts-v${MITTS_VERSION}-${{ matrix.mitts }}.tar.gz"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/alex09x/mitts/releases/download/v${MITTS_VERSION}/$archive"
          echo "${{ matrix.mitts_sha256 }}  $RUNNER_TEMP/$archive" | shasum -a 256 -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$HOME/.local/bin" mitts
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          test "$("$HOME/.local/bin/mitts" --version | awk '{print $2}')" = "$MITTS_VERSION"
      - name: Build
        env:
          MACOSX_DEPLOYMENT_TARGET: "14.0"
        run: mitts build --locked --release -p tako-session
      - name: Package
        run: |
          set -euo pipefail
          got="$(target/release/tako-session version | awk '$1=="tako_core"{print $2}')"
          echo "binary reports: $got"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            want="${GITHUB_REF_NAME#session-v}"
            test "$got" = "$want" || { echo "version $got does not match tag $GITHUB_REF_NAME" >&2; exit 1; }
          fi
          mkdir -p dist
          cp target/release/tako-session "dist/${{ matrix.asset }}"
          strip "dist/${{ matrix.asset }}" || true
          cd dist
          shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          cat "${{ matrix.asset }}.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag \
            --repo "$GITHUB_REPOSITORY" \
            --title "tako-session ${GITHUB_REF_NAME#session-v}" \
            --notes "tako-session ${GITHUB_REF_NAME#session-v}: the session runtime as a single binary for macOS arm64 (macOS 14+) and Linux x86_64. Each binary has a .sha256 file next to it. See tako-session/README.md."
